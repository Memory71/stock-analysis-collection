<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投資型保險商品業務員 刷題器</title>
<style>
  :root{
    --paper:#FBFAF7;
    --rule:#D8D3C7;
    --ink:#1C1B18;
    --graphite:#5B584F;
    --mark:#1F4E79;      /* 劃記藍 */
    --wrong:#A32B22;     /* 紅筆 */
    --right:#1D6B4F;
    --star:#B07A10;      /* 螢光註記 */
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    font-size:16px; line-height:1.7;
    -webkit-text-size-adjust:100%;
  }
  .sheet{max-width:44rem;margin:0 auto;padding:1.25rem 1.1rem 7rem}
  .num{font-variant-numeric:tabular-nums}

  header{border:1.5px solid var(--ink);padding:.7rem .85rem;margin-bottom:1.1rem}
  header h1{font-size:1.05rem;margin:0;font-weight:700;letter-spacing:.02em}
  header .meta{font-size:.8rem;color:var(--graphite);margin-top:.15rem}
  .scorebar{display:flex;gap:1.3rem;margin-top:.6rem;padding-top:.55rem;border-top:1px dashed var(--rule);
            font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--graphite);flex-wrap:wrap}
  .scorebar b{color:var(--ink);font-size:1.05rem;font-weight:700}
  .scorebar b.slow{color:var(--wrong)}
  .scorebar b.fast{color:var(--right)}

  .controls{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.5rem}
  button{font:inherit;cursor:pointer}
  .chip{background:none;border:1px solid var(--rule);color:var(--graphite);
        padding:.28rem .7rem;border-radius:1rem;font-size:.85rem}
  .chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
  .chip:focus-visible,.bubble:focus-visible,.act:focus-visible,.star:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
  .divider{width:100%;height:0}
  .chip .cnt{font-size:.72rem;opacity:.7;margin-left:.3rem;font-variant-numeric:tabular-nums}
  .chip.hot{border-color:var(--star);color:var(--ink);background:#FBF1DA}
  .chip.hot::before{content:"★";color:var(--star);margin-right:.25rem;font-size:.75rem}
  .chip.hot[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .chip.hot[aria-pressed="true"]::before{color:#F2C35B}
  .hotnote{font-size:.78rem;color:var(--graphite);margin:-.1rem 0 .7rem}
  .hotnote b{color:var(--star)}
  .util{display:flex;gap:.9rem;margin-bottom:1.1rem;font-size:.78rem;align-items:center;flex-wrap:wrap}
  .jump{display:flex;gap:.3rem;align-items:center;margin-left:auto}
  .jump input{font:inherit;font-size:.78rem;width:4.5rem;padding:.2rem .4rem;
              border:1px solid var(--rule);border-radius:.2rem;background:#fff;color:var(--ink);
              font-variant-numeric:tabular-nums}
  .jump input:focus{outline:2px solid var(--mark);outline-offset:1px}
  .jumpmsg{color:var(--wrong)}
  .util button{background:none;border:none;padding:0;color:var(--graphite);text-decoration:underline;
               text-underline-offset:3px;font-size:.78rem}
  .util button:hover{color:var(--ink)}

  .qwrap{border-top:1.5px solid var(--ink);padding-top:.9rem}
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:.6rem;margin-bottom:.35rem}
  .qno{font-size:.8rem;color:var(--graphite);font-variant-numeric:tabular-nums}
  .qno .flag{color:var(--wrong);font-weight:700}
  .timer{font-size:.8rem;color:var(--graphite);font-variant-numeric:tabular-nums;white-space:nowrap}
  .timer.over{color:var(--wrong)}
  .star{background:none;border:1px solid var(--rule);color:var(--graphite);border-radius:1rem;
        padding:.2rem .65rem;font-size:.78rem;white-space:nowrap}
  .star[aria-pressed="true"]{border-color:var(--star);background:var(--star);color:#fff}
  .stem{font-size:1.08rem;line-height:1.75;margin:0 0 1rem}

  .opts{display:flex;flex-direction:column;gap:.1rem;margin-bottom:1rem}
  .bubble{display:flex;align-items:flex-start;gap:.7rem;width:100%;text-align:left;
          background:none;border:none;padding:.5rem .4rem;border-radius:.25rem;line-height:1.6}
  .bubble:hover:not(:disabled){background:rgba(31,78,121,.06)}
  .bubble:disabled{cursor:default}
  .dot{flex:none;width:1.65rem;height:1.65rem;border:1.5px solid var(--graphite);border-radius:50%;
       display:grid;place-items:center;font-size:.85rem;color:var(--graphite);
       font-variant-numeric:tabular-nums;margin-top:.05rem;transition:background .12s,border-color .12s}
  .bubble.picked .dot{background:var(--mark);border-color:var(--mark);color:#fff}
  .bubble.correct .dot{background:var(--right);border-color:var(--right);color:#fff}
  .bubble.miss .dot{background:var(--wrong);border-color:var(--wrong);color:#fff}
  .bubble.correct .txt{color:var(--right);font-weight:600}
  .bubble.miss .txt{color:var(--wrong)}
  .bubble.dim .txt{color:#8C8880}

  .verdict{font-size:.92rem;margin:0 0 1rem;min-height:1.5rem}
  .verdict.ok{color:var(--right)}
  .verdict.no{color:var(--wrong)}
  .expl{font-size:.9rem;line-height:1.7;white-space:pre-wrap;margin:-.4rem 0 1rem;padding:.6rem .8rem;
        border-left:3px solid var(--rule);background:rgba(127,127,127,.06)}
  .expl b{display:block;font-size:.78rem;color:var(--graphite);margin-bottom:.2rem}

  .acts{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
  .act{background:var(--ink);color:var(--paper);border:1.5px solid var(--ink);
       padding:.45rem 1.1rem;border-radius:.25rem;font-size:.92rem}
  .act.ghost{background:none;color:var(--ink)}
  .act:disabled{opacity:.35;cursor:default}

  .navbar{position:fixed;left:0;right:0;bottom:0;z-index:20;
          background:var(--paper);border-top:1.5px solid var(--ink)}
  .navinner{max-width:44rem;margin:0 auto;padding:.6rem 1.1rem;
            display:flex;align-items:center;justify-content:space-between;gap:.8rem}
  .navpos{font-size:.82rem;color:var(--graphite);font-variant-numeric:tabular-nums;text-align:center}
  .navbar .act{padding:.5rem 1.2rem}
  @supports (padding:env(safe-area-inset-bottom)){
    .navinner{padding-bottom:calc(.6rem + env(safe-area-inset-bottom))}
  }
  .empty{padding:2.5rem 0;color:var(--graphite);text-align:center}
  .empty p{margin:.4rem 0}
  footer{margin-top:2rem;padding-top:.8rem;border-top:1px dashed var(--rule);
         font-size:.78rem;color:var(--graphite)}
  .note{margin-top:.35rem}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:420px){
    .sheet{padding:1rem .8rem 6.5rem} .stem{font-size:1.02rem}
    .navinner{padding-left:.8rem;padding-right:.8rem}
    .navbar .act{padding:.5rem .9rem;font-size:.88rem}
  }
</style>
</head>
<body>
<div class="sheet">

<header>
  <h1>投資型保險商品業務員 刷題器</h1>
  <div class="meta" id="meta"></div>
  <div class="scorebar">
    <span>本回作答 <b id="sDone">0</b></span>
    <span>答對 <b id="sRight">0</b></span>
    <span>正確率 <b id="sRate">—</b></span>
    <span>平均秒數 <b id="sAvg">—</b></span>
    <span>累計作答 <b id="sTime">0:00</b></span>

    <span>重點 <b id="sStar">0</b></span>
  </div>
</header>

<div class="controls" id="controls"></div>
<div class="hotnote" id="hotnote" hidden></div>
<div class="util">
  <button id="btnExport">匯出進度</button>
  <button id="btnImport">匯入進度</button>
  <button id="btnResetSeen">重設未做過紀錄</button>
  <button id="btnResetSession">重設本回計時</button>

  <span class="jump">
    <label for="jumpNo">跳到第</label>
    <input type="number" id="jumpNo" min="1" inputmode="numeric" aria-label="跳到題號">
    <label for="jumpNo">題</label>
    <button id="btnJump">前往</button>
  </span>
</div>
<div class="util"><span id="jumpmsg" class="jumpmsg"></span></div>

<div id="stage"></div>

<footer id="foot"></footer>
</div>

<nav class="navbar" id="navbar">
  <div class="navinner">
    <button class="act ghost" id="prev">← 上一題</button>
    <span class="navpos" id="navpos"></span>
    <button class="act" id="next">下一題 →</button>
  </div>
</nav>

<script>

tem":"有些指數年金會在契約終了一定期間內，讓保戶選擇年金價值處理方式，此一期間稱為：","opts":["等待期間","除斥期間","免責期間","選擇期間"]},{"no":148,"ans":1,"stem":"指數年金之利率是如何計算出來的？","opts":["依照該年金產品所設定之公式求得一個指數本身變動之比率，再將所求得的數值乘以「參與率」或減掉「差額」","依照該年金產品所設定之公式求得一個指數本身變動之比率，再將所求得的數值除以「參與率」或加上「差額」","依照該年金產品所設定之公式求得一個指數本身變動之比率，再將所求得的數值乘以「參與率」再加上「差額」","以上皆非"]},{"no":149,"ans":1,"stem":"下列敘述，何者錯誤？","opts":["較高的參與率必將產生高的利率","多年期增加法與年增法類似，差別在於多年期增加法通常是每2或3年計算股價指數增加率","指數年金另外常用以決定利率高低的方法之一為差額，即將指數本身變動之比率扣減一固定比率","指數年金的年金金額在簽訂契約的當時無法得知"]},{"no":150,"ans":4,"stem":"下列關於指數年金之敘述，何者錯誤？","opts":["保單持有人之保單價值未納入分離帳戶","基於「開/關」原理而設計的是數位法(digitalmethod)","可彈性繳保費","當指數連動之利率較低時，減掉一個固定的差額(margin)，是較好的選擇"]},{"no":151,"ans":3,"stem":"下列方式中，何者並非對求得指數年金中較高的利率之方式？","opts":["指數連動利率採用點對點法","指數連動之利率較低時，將它乘以參與率","指數連動之利率較低時，選擇減掉差額","指數連動利率採取數位法"]},{"no":152,"ans":4,"stem":"下列關於指數年金之選擇期間( window period )的敘述，何者錯誤？","opts":["一般訂於原保單期間終了的30到45天","在此期間保戶可選擇採取指數連動利率或最低保證利率計算利息收益","保戶選擇其年金價值之處置方式","保險公司在此期間必須宣告續年利率"]},{"no":153,"ans":2,"stem":"指數型年金其利息的計算與股價指數連動，若指數報酬率為負時，將給付利率定為0%，稱為？","opts":["上限( Cap )","下限( Floor )","差額( Margin )","選擇期間( Window Period )"]},{"no":154,"ans":3,"stem":"假設10,000美元之指數年金，契約期間五年、指數連動利率採「點對點法」、參與率90% ，購買時之S&P指數為1000點!在五年契約期間，若每週年之S&P指數分別為900、 1000、950、1200，契約到期時之指數則為1500點!請問此契約的指數報酬率(實際利率) 為多少？","opts":["18%","20%","45%","50%"]},{"no":155,"ans":3,"stem":"假設周先生購買了10,000美元的指數年金，契約10年，且S&P指數為1000點!若指數連動利率採﹝點對點法﹞，參與率為70%，且契約終了指數為1200點，契約期間最高指數為1500點，則周先生可獲利息為：","opts":["500","700","1,400","2,000"]},{"no":156,"ans":4,"stem":"假設周先生購買了8,000美元的指數年金，契約5年，當時之S&P指數為800點，之後每週年之S&P500指數分別為1000點、1200點、1100點、1400點、契約到期時之指數為1600點，若指數連動利率採「點對點法」、參與率80%，則契約到期時周先生可獲多少美元之利息？","opts":["14,250","16,750","9,650","6,400"]},{"no":157,"ans":2,"stem":"假設王小姐購買了6,000美元的指數年金，契約10年，且S&P指數為1,200點，而最低保證利率的利息，以保費九成年利率2%來計算!若現今指數連動利率採「高標法」，參與率80%，且契約終了指數為1300點，契約最高指數1500點，則王小姐可獲利息：","opts":["583","1,200","1,500","1,750"]},{"no":158,"ans":3,"stem":"假設王小姐購買了5,000美元的指數年金，契約10年，且S&P指數為1,000點，而最低保證利率的利息，以保費九成年利率3%來計算!若現今指數連動利率採「高標法」，參與率70%，且契約終了指數為1200點，則王小姐可獲多少利息：","opts":["700","900","1,048","1,050"],"ex":"高標法：總金額 * [(最高-期初) ÷ 期初] * 參與率\n→ 5,000 * [(1,200-1,000) ÷ 1,000] * 70% = 700\n最低保證利息：[總金額 * 保證成數 * (1 + 年利率)^期數] - 總金額\n→[5,000 * 90% * (1+3%)^10] - 5,000 = 6,048 - 5,000 = 1,048\n最低保證利息1,048 > 高標法取得的利息700，因此王小姐可獲得1,048元!"},{"no":159,"ans":3,"stem":"假設胡小姐購買了15,000美元的指數年金，契約七年，指數連動利率採「高標法」，參與率100%，且最低保證利率為累積保費九成3%計算，購買當時之S&P指數為1000點!七年後，契約期間指數之最高點若為1100點!請問胡小姐可得的利息為多少？","opts":["1,500","450","1,603","以上皆非"],"ex":"高標法：總金額 * [(最高-期初) ÷ 期初] * 參與率\n→ 15,000 * [(1,100-1,000) ÷ 1,000] * 100% = 1,500\n最低保證利息：[總金額 * 保證成數 * (1 + 年利率)^期數] - 總金額\n→[15,000 * 90% * (1+3%)^7] - 15,000 = 16,603 - 15,000 = 1,603\n最低保證利息1,603 > 高標法取得的利息1,500，因此胡小姐可獲得1,603元!"},{"no":160,"ans":2,"stem":"假設胡小姐選擇購買9,000美元之指數年金，契約期間5年，當時之S&P500指數為800點，之後每週年之S&P指數分別為1000點、1200點、1500點、1000點、契約到期時之指數為1200點，若指數連動利率採「高標法」、參與率80%，則契約到期時，胡小姐可獲多少美元之利息？","opts":["4,250","6,300","6,750","7,650"]},{"no":161,"ans":3,"stem":"假設胡小姐購買10,000美元之指數年金，契約期間7年，指數連動利率採「高標法」，參與率為95%，當時之S&P500指數為1000點，七年後契約期間之最高點為1500點，則胡小姐可獲得多少利息？","opts":["5,750","6,750","4,750","3,750"]},{"no":162,"ans":3,"stem":"假設胡小姐選擇購買10,000美元之指數年金，契約期間5年，當時之S&P500指數為800點，之後每週年之S&P指數分別為1000點、1200點、1400點、1500點、契約到期時之指數為1400點，若指數連動利率採「高標法」、差額(margin)5%，則契約到期時，胡小姐可獲多少美元之利息？","opts":["4,250","6,750","8,250","7,000"],"ex":"高標法：(合約期間最高指數1500－合約起始時指數800) /合約起始時指數800 = 0.875指數年金利率：高標法(0.875)－差額(0.05) = 0.825；利息=本金(10000)x利率(0.825)"},{"no":163,"ans":4,"stem":"假設胡小姐選擇購買10,000美元之指數年金，契約期間5年，當時之S&P500指數為800點，之後每週年之S&P指數分別為770點、650點、760點、430點、契約到期時之指數為680點，若指數連動利率採「高標法」、參與率90%!若選擇最低保證利率的計息方式，以保費九成，年利率3%複利計算，則契約到期時胡小姐可獲多少美元之利息？","opts":["10,433.47","13,350.6","350.65","433.47"],"ex":"高標法：10,000 * [(770-800) ÷ 800] * 90% = -337.5\n最低保證利息：[10,000 * 90% * (1+3%)^5] - 10,000 = 10,433.47 - 10,000 = 433.47使用高標法無法獲得利息，因此可取得最低保證利息433.47元!"},{"no":164,"ans":4,"stem":"假設胡小姐選擇購買10,000美元之指數年金，契約期間5年，當時之S&P500指數為862點，之後每週年之S&P指數分別為700點、500點、440點、900點、契約到期時之指數為792點，若指數連動利率採「低標法」、參與率90%，則契約到期時胡小姐可獲多少美元之利息？","opts":["8,590.91","6,700","5,950","7,200"]},{"no":165,"ans":2,"stem":"假設古先生購買5,000美元的指數年金，契約期間5年，指數連動利率採「年增法」，參與率90%，當時的S&P500指數為1000點，若五年契約期間每週年的S&P指數分別為900點、800點、850點、800點、910點、則古先生可獲利息：","opts":["0","900","1,600","3,659"],"ex":"年增法：以契約期間各年度年初至年底指數之增加率加總而得!\n[(第1年-第0年)/第0年] + [(第2年-第1年)/第1年] + …若增加率<0則以0計算\n此處第0年是指購買契約時的指數!\n= [(900-1000)/1000] + [(800-900)/900] + [(850-800)/800] + [(800-850)/850] + [(910-800)/800]\n= (-0.1，以0計算) + (-0.11，以0計算) + 0.0625 + (-0.06，以0計算) + 0.1375\n= 0 + 0 + 0.0625 + 0 + 0.1375 = 0.2\n年增法數值乘參與率 = 0.2 *參與率0.9 = 0.18\n利息 = 本金5,000 * 0.18 = 900"},{"no":166,"ans":2,"stem":"有關附有最低保證給付投資型保險，下列何種保證係保障保單價值準備金之下檔風險？","opts":["保證最低身故給付","保證最低滿期給付","保證最低收入給付","保證最低提領給付"]},{"no":167,"ans":1,"stem":"保戶如選擇保證給付商品，公司會取何種投資型保險費用？","opts":["保證費用","附加費用","管理費用","免費贈送"]},{"no":168,"ans":1,"stem":"保險公司係在哪一時點收取附加費用？","opts":["保險費繳付時","投資配置日","每期保單週月日","解約日"]},{"no":169,"ans":2,"stem":"我國保險法令規定投資型人壽保險之各年度目標保險費附加費用率總和，不得超過保險費多少百分比？","opts":["100%","150%","180%","200%"]},{"no":170,"ans":4,"stem":"我國保險主管機關規定各年度目標保險費附加費用率不得超過附加費用率平均值之一定倍數，其主要目的為何？","opts":["避免投保金額太低","維持一定淨危險保額","維持費用率透明度","讓較多保險費餘額可以投資"]},{"no":171,"ans":1,"stem":"置於專設帳簿之資產與保險人之其他資產間，不得互相出售、交換或移轉!但有下列那些情事之一者，不在此限：","opts":["將資產轉入專設帳簿做為其設立之用，或用於支應該轉入專設帳簿保單之正常運作","為保單貸款或投資型保險投資管理辦法第四條訂定之各項費用必要之轉出","為維護保險人或受益人之利益","以上皆是"],"ex":"參考「投資型保險投資管理辦法」第8條!"},{"no":172,"ans":4,"stem":"對於保險人運用與管理投資型保險資金之專設帳簿資產時，下列敘述何者錯誤：","opts":["保險人指派具有金融、證券或其他投資業務經驗之專業人員運用與管理專設帳簿之資產","不得將專設帳簿之資產借予他人!但主管機關另有規定者，不在此限","不得從事法令禁止投資之項目","得提供專設帳簿之資產做為擔保之用"]},{"no":173,"ans":1,"stem":"投資型保險為保護保單持有人權益，運用了那兩個機制：","opts":["專設帳簿及資產交付保管機制","專設帳簿及投資機制","專設帳簿及費用揭露機制","專設帳簿及免課稅負機制"]},{"no":174,"ans":4,"stem":"下列哪一項投資標的不是全權委託型與非全權委託型投資型保險共同可進行投資範圍：","opts":["銀行存款","公債","金融債券","外國有價證券"]},{"no":175,"ans":4,"stem":"下列何種行為會造成投資型保單之投資標的單位數變化？","opts":["部份提領","投資標的轉換","保險費增加","以上皆是"]},{"no":176,"ans":1,"stem":"投資型保險專設帳簿資產，如係保險人接受要保人以保險契約委任全權決定運用標的者，下列何者不屬於其運用範圍？","opts":["結構型債券","台灣存託憑證","金融債券","外國銀行發行之浮動利率中期債券"]},{"no":177,"ans":1,"stem":"某一分離帳戶在五月一日的資產總值為800,000元，所有保戶持有之單位總數 const inScope = q => subject==='all' || (subject==='__hot__' ? HOT.has(q.subject) : q.subject===subject);
const scopeName = () => subject==='all' ? '全部科目' : (subject==='__hot__' ? '高頻重點' : subject);

function fmt(s){ s=Math.max(0,Math.round(s)); const m=Math.floor(s/60); return m+':'+String(s%60).padStart(2,'0'); }

function pool(){
  let p = ALL.filter(inScope);
  if(mode==='wrong') p = p.filter(q => log.wrong[key(q)]);
  if(mode==='star')  p = p.filter(q => log.star[key(q)]);
  if(mode==='new')   p = p.filter(q => !log.seen[key(q)]);
  return p;
}
function rebuild(){
  queue = pool();
  if(mode==='rand'){ for(let i=queue.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[queue[i],queue[j]]=[queue[j],queue[i]];} }
  pos=0; picks=new Array(queue.length).fill(null); times=new Array(queue.length).fill(null);
  msg(''); render();
}

/* ---------- 控制列 ---------- */
function controls(){
  const subs = [['all','全部']]
    .concat(HOT.size ? [['__hot__','高頻重點合併']] : [])
    .concat(SUBJECTS.map(s=>[s,s]));
  const defs=[
    ['科目', subs, ()=>subject, v=>{subject=v;rebuild();}],
    ['模式', [['seq','依題號'],['rand','隨機'],['new','未做過'],['wrong','錯題本'],['star','重點題']],
             ()=>mode, v=>{mode=v;rebuild();}]
  ];
  const c=$('controls'); c.innerHTML='';
  defs.forEach(([label,opts,get,set],i)=>{
    opts.forEach(([v,txt])=>{
      const b=document.createElement('button');
      b.className='chip'+((i===0 && (HOT.has(v)||v==='__hot__')) ? ' hot' : ''); b.textContent=txt;
      if(i===0 && META && META.counts){
        const n = v==='all' ? ALL.length
                : v==='__hot__' ? ALL.filter(q=>HOT.has(q.subject)).length
                : META.counts[v];
        if(n) b.appendChild(Object.assign(document.createElement('span'),{className:'cnt',textContent:n}));
      }
      b.setAttribute('aria-pressed', get()===v);
      b.setAttribute('aria-label', label+'：'+txt);
      b.onclick=()=>set(v);
      c.appendChild(b);
    });
    if(i===0) c.appendChild(Object.assign(document.createElement('span'),{className:'divider'}));
  });
  const hn=$('hotnote');
  if(hn && META && META.note){ hn.hidden=false; hn.innerHTML='<b>★</b> '+META.note; }
}

/* ---------- 計時 ---------- */
function startClock(){
  qStart = performance.now(); qFrozen = null;
  if(ticker) clearInterval(ticker);
  ticker = setInterval(tick, 250);
  tick();
}
function stopClock(){
  if(qStart!==null && qFrozen===null) qFrozen = (performance.now()-qStart)/1000;
  if(ticker){ clearInterval(ticker); ticker=null; }
  tick();
}
function tick(){
  const el=$('qtimer'); if(!el) return;
  const s = qFrozen!==null ? qFrozen : (qStart!==null ? (performance.now()-qStart)/1000 : 0);
  el.textContent = '本題 '+s.toFixed(0)+' 秒';
  el.classList.toggle('over', s > PACE);
}
function navbar(){
  const active = queue.length && pos < queue.length;
  $('navbar').style.display = queue.length ? '' : 'none';
  $('prev').disabled = pos <= 0;
  $('next').disabled = pos >= queue.length;
  $('navpos').textContent = active ? `本輪 ${pos+1} / ${queue.length}`
                                   : (queue.length ? `已完成 ${queue.length} 題` : '');
}

function scoreboard(){
  const rate = session.done ? Math.round(session.right/session.done*100)+'%' : '—';
  const avg  = session.done ? (session.secs/session.done) : null;
  $('sDone').textContent=session.done;
  $('sRight').textContent=session.right;
  $('sRate').textContent=rate;
  const a=$('sAvg');
  a.textContent = avg===null ? '—' : avg.toFixed(1)+' 秒';
  a.className = avg===null ? '' : (avg>PACE ? 'slow' : 'fast');
  $('sTime').textContent = fmt(session.secs);
  $('sWrong').textContent=Object.keys(log.wrong).length;
  $('sStar').textContent=Object.keys(log.star).length;
  $('meta').textContent = `題庫 ${ALL.length} 題　已作答過 ${Object.keys(log.seen).length} 題　進度存於 ${storeKind}`;
}

/* ---------- 畫面 ---------- */
function render(){
  controls(); scoreboard(); navbar();
  $('foot').innerHTML = mode==='wrong'
      ? '錯題答對後會自動移出錯題本。重點題不會，要自己取消標記。'
      : (mode==='star'
        ? '這裡只出現你標記過的題目。按「已標記」即可取消，該題就會離開這個清單。'
        : '答錯自動進錯題本。看到想反覆練的題，按右上角「標記重點」存起來。')
      + `<div class="note">每題目標 ${PACE} 秒。鍵盤 1–4 作答、← → 前後題、Enter 下一題、S 標記重點。
       未作答就換頁不會計入「已作答過」。</div>`;

  const stage=$('stage');
  if(!queue.length){
    const msg = mode==='wrong' ? '錯題本是空的。' : (mode==='star' ? '還沒有標記任何重點題。' : '這個範圍沒有題目了。');
    stage.innerHTML = `<div class="empty"><p>${msg}</p><p>換個科目或模式再來一輪。</p></div>`;
    if(ticker){clearInterval(ticker);ticker=null;}
    return;
  }
  if(pos>=queue.length){
    stage.innerHTML = `<div class="empty"><p>這一輪 ${queue.length} 題做完了。</p>
      <p>本回答對 ${session.right} / ${session.done}，平均 ${session.done?(session.secs/session.done).toFixed(1):'—'} 秒。</p>
      <p><button class="act" id="again">再來一輪</button></p></div>`;
    $('again').onclick=rebuild;
    if(ticker){clearInterval(ticker);ticker=null;}
    return;
  }

  const q=queue[pos], k=key(q), picked = picks[pos], answered = picked!==null;
  stage.innerHTML = `
    <div class="qwrap">
      <div class="qhead">
        <div class="qno">${q.subject}　第 ${q.no} 題
          ${log.wrong[k]?'<span class="flag">· 錯題</span>':''}</div>
        <div class="qhead" style="gap:.6rem">
          <span class="timer" id="qtimer"></span>
          <button class="star" id="star" aria-pressed="${!!log.star[k]}">${log.star[k]?'已標記':'標記重點'}</button>
        </div>
      </div>
      <p class="stem"></p>
      <div class="opts" id="opts"></div>
      <p class="verdict" id="verdict"></p>
      <div class="expl" id="expl" hidden><b>解析</b><span></span></div>
    </div>`;
  stage.querySelector('.stem').textContent = q.stem;

  const ow=$('opts');
  q.opts.forEach((o,i)=>{
    const n=i+1, b=document.createElement('button');
    b.className='bubble'; b.disabled=answered;
    b.innerHTML=`<span class="dot">${n}</span><span class="txt"></span>`;
    b.querySelector('.txt').textContent=o;
    if(answered){
      if(isRight(q,n)) b.classList.add('correct');
      else if(n===picked) b.classList.add('miss');
      else b.classList.add('dim');
    }
    b.onclick=()=>answer(n);
    ow.appendChild(b);
  });

  if(answered){
    const ok = isRight(q,picked), v=$('verdict');
    v.className='verdict '+(ok?'ok':'no');
    v.textContent = (ok ? `答對，正解是 (${q.ans})。` : `答錯了，正解是 (${q.ans})。`)
                  + (q.alt ? `（本題原檔有瑕疵，選 (${q.alt.join(')(')}) 也算對）` : '')
                  + `　你當時選了 (${picked})，回看不計分。`;
    if(q.ex){ const e=$('expl'); e.hidden=false; e.querySelector('span').textContent=q.ex; }
  }
  $('star').onclick=()=>toggleStar(k);

  if(answered){ qFrozen = times[pos]; qStart=null; if(ticker){clearInterval(ticker);ticker=null;} tick(); }
  else { startClock(); }
}

function isRight(q,n){ return n===q.ans || (Array.isArray(q.alt) && q.alt.includes(n)); }

async function answer(n){
  if(picks[pos]!==null) return;
  stopClock();
  const q=queue[pos], k=key(q);
  picks[pos]=n; times[pos]=qFrozen||0;
  session.done++; session.secs += (qFrozen||0);
  log.seen[k]=1;
  if(isRight(q,n)){ session.right++; delete log.wrong[k]; } else { log.wrong[k]=1; }
  await Store.set(KEY, log);
  render();
}

async function toggleStar(k){
  if(log.star[k]) delete log.star[k]; else log.star[k]=1;
  await Store.set(KEY, log);
  // 在重點題模式取消標記時，讓該題留到換頁才消失，避免畫面跳動
  const btn=$('star');
  if(btn){ btn.setAttribute('aria-pressed', !!log.star[k]); btn.textContent = log.star[k]?'已標記':'標記重點'; }
  scoreboard();
}

/* ---------- 匯出／匯入 ---------- */
$('btnExport').onclick=()=>{
  const blob=new Blob([JSON.stringify(log)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='drill-progress-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(a.href);
};
$('btnImport').onclick=()=>$('fileImport').click();
$('fileImport').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const d=JSON.parse(await f.text());
    log.seen ={...log.seen,  ...(d.seen ||{})};
    log.wrong={...log.wrong, ...(d.wrong||{})};
    log.star ={...log.star,  ...(d.star ||{})};
    await Store.set(KEY, log);
    rebuild();
  }catch(err){ alert('這個檔案讀不出來，請確認是匯出的 JSON 進度檔。'); }
  e.target.value='';
};
function msg(t){ const e=$('jumpmsg'); if(e) e.textContent=t; }

function jump(){
  const raw = $('jumpNo').value.trim();
  if(!raw){ msg('請先輸入題號。'); return; }
  const n = parseInt(raw,10);
  if(!Number.isInteger(n) || n<1){ msg('題號要是正整數。'); return; }
  const hits = queue.map((q,i)=>({q,i})).filter(x => x.q.no===n);
  if(!hits.length){
    const inBank = ALL.some(q => q.no===n && inScope(q));
    msg(inBank ? `第 ${n} 題不在目前這一輪（${modeName()}）裡。切到「依題號」再試。`
               : `目前範圍內沒有第 ${n} 題。`);
    return;
  }
  if(hits.length>1){
    msg(`兩科都有第 ${n} 題，已跳到${hits[0].q.subject}。要另一科請先在上方選定科目。`);
  } else { msg(''); }
  pos = hits[0].i;
  render();
  $('jumpNo').blur();
}
function modeName(){
  return {seq:'依題號',rand:'隨機',new:'未做過',wrong:'錯題本',star:'重點題'}[mode];
}
$('btnJump').onclick=jump;
$('jumpNo').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); jump(); } };

$('btnResetSeen').onclick=async ()=>{
  const scope = scopeName();
  const ks = Object.keys(log.seen).filter(k => {
    const sub = k.slice(0, k.lastIndexOf('#'));
    return subject==='all' || (subject==='__hot__' ? HOT.has(sub) : sub===subject);
  });
  if(!ks.length){ alert(`「${scope}」目前沒有作答紀錄可以重設。`); return; }
  if(!confirm(`要清除「${scope}」的 ${ks.length} 題作答紀錄嗎？\n\n這些題會重新回到「未做過」。\n錯題本與重點題不受影響。`)) return;
  ks.forEach(k => delete log.seen[k]);
  await Store.set(KEY, log);
  rebuild();
};
$('btnResetSession').onclick=()=>{ session={done:0,right:0,secs:0}; render(); };

$('prev').onclick=()=>{ if(pos>0){ pos--; msg(''); render(); window.scrollTo(0,0); } };
$('next').onclick=()=>{ if(pos<queue.length){ pos++; msg(''); render(); window.scrollTo(0,0); } };

document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  if(['1','2','3','4'].includes(e.key)){ if(queue.length && pos<queue.length && picks[pos]==null && +e.key<=queue[pos].opts.length) answer(+e.key); }
  else if(e.key==='s'||e.key==='S'){ const b=$('star'); if(b) b.click(); }
  else if(e.key==='ArrowLeft'){ const b=$('prev'); if(b&&!b.disabled){ e.preventDefault(); b.click(); } }
  else if(e.key==='ArrowRight'){ const b=$('next'); if(b&&!b.disabled){ e.preventDefault(); b.click(); } }
  else if(e.key==='Enter'||e.key===' '){ const b=$('next'); if(b&&!b.disabled){ e.preventDefault(); b.click(); } }
});

(async ()=>{
  const saved = await Store.get(KEY);
  if(saved){ log={ seen:saved.seen||{}, wrong:saved.wrong||{}, star:saved.star||{} }; }
  rebuild();
})();
</script>
</body>
</html>
